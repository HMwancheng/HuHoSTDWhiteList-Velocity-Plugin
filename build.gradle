plugins {
    id 'java'
}

group = 'com.stoopad'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.velocitypowered.com/repository/maven-public/' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
    annotationProcessor 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
    compileOnly 'com.alibaba.fastjson2:fastjson2:2.0.53'
    compileOnly files('libs/HuHoBot-Velocity.jar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    archiveFileName = 'HuHoSTDWhiteList-Velocity.jar'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}