name: Build Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependencies
        run: gradle dependencies --no-daemon -q

      - name: Debug Velocity API packages
        run: |
          VELOCITY_JAR=$(find ~/.gradle -name "velocity-api-*.jar" ! -name "*-sources*" ! -name "*-javadoc*" 2>/dev/null | head -3)
          echo "Found jars:"
          echo "$VELOCITY_JAR"
          for jar in $VELOCITY_JAR; do
            echo "=== Contents of $jar ==="
            jar tf "$jar" | grep -i "messaging\|ChannelRegistrar\|ChannelIdentifier" || echo "  (no messaging classes)"
          done

      - name: Build HuHoBot stub
        run: |
          curl -sL -o fastjson2.jar https://repo1.maven.org/maven2/com/alibaba/fastjson2/fastjson2/2.0.53/fastjson2-2.0.53.jar
          mkdir -p libs stub_out
          javac -cp fastjson2.jar stub/cn/huohuas001/huhobot/velocity/api/BotCustomCommand.java -d stub_out
          cd stub_out
          jar cf ../libs/HuHoBot-Velocity.jar cn/

      - name: Build
        run: gradle jar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuHoSTDWhiteList-Velocity
          path: build/libs/HuHoSTDWhiteList-Velocity.jar